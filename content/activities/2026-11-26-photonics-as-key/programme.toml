  speaker = "Prof. Paolo Bettotti"
  affiliation = """Functional Interface Laboratory
Department of Physics
University of Trento
Povo, Trento, Italy"""
  title = "Nanoporous Silicon: From Light Tailoring to Sensing Applications"
  abstract = """As one of the early researchers in the group, my work focused on mastering the electrochemical synthesis and physical properties of porous silicon-based nanomaterials. What began as an exploration into fundamental light manipulation quickly evolved into practical device engineering.

Initially, I developed the technique to fabricate two-dimensional optical structures, using precise electrochemical etching to modulate porosity and realize high-quality photonic crystals structures. These strutures allow us to control photonic bandgaps and light propagation in ordered pore arrays.

As our control over morphology and surface chemistry matured, we shifted towards applying both 1D and 2D porous networks to chemical and biological sensing. By exploiting the high surface-to-volume ratio, refractive index changes upon analyte infiltration, and structural optical response, we turned these photonic architectures into efficient sensing platforms.

This talk walks through those foundational porous silicon milestones, tracing how early optical physics opened the door to modern nanostructured sensing technologies."""

