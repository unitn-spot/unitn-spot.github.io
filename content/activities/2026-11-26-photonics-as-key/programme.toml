  speaker = "Dr. Mher Ghulinyan"
  affiliation = """Integrated and Quantum Optics (I&QO)
Center for Sensors and Devices (FBK-SD)
Bruno Kessler Foundation (FBK)
Trento, Italy"""
  title = "Porous Silicon Optical Superlattices: Where Photons Behave Like Electrons"
  abstract = """From conceptualization and design to fabrication and experiments: the years 2002 to 2006 marked a pivotal point in my early career research at the University of Trento under Prof. Pavesi’s supervision. The first-time-ever realization and characterization of porous silicon-based optical superlattices (OSLs), composed by hundreds of submicron-thick layers, paved the way to the first demonstrations of optical analogies of fundamental solid-state phenomena: photonic Bloch oscillations and resonant Zener tunnelling of photons, Anderson localization of light and the observation of optical necklace states, vapor-controlled tilting of photonic bands and all-optical switching using capillary condensation. This research placed the UniTN team within the world’s leading groups in light propagation studies in optical superlattices. On top of this, extreme personal motivation, Sundays and night hours spent in the lab, scientific excitement and satisfaction are the adjectives which describe the years I’ve spent at UniTN."""

  [[days.events]]
  time = "16:05"
  title = "Coffee break"

  [[days.events]]
  time = "16:25"
  speaker = "Dr. Alessandro Trenti"
  affiliation = """Center for Digital Safety & Security
AIT Austrian Institute of Technology
Vienna, Austria"""
  title = "From Nanolab to AIT: a journey from quantum photonics to quantum communication"
  abstract = """In the first part of the presentation, I will give an overview of my research journey from the Nanolab group at the University of Trento, to the Walther group at the University of Vienna which then led to joining the Austrian Institute of Technology (AIT). I will then introduce the field of quantum cryptography, from the basic to an outlook of the developments in particular in the field of Quantum Key Distribution. In the last part, I will show experimental results of 2 research activities in the quantum group at AIT. Namely, we will discuss current miniaturization efforts of QKD components on chip and the investigation of beyond QKD cryptographic protocols enabling multi-party computation applications."""

  [[days.events]]
  time = "16:55"
  speaker = "Dr. Massimo Borghi"
  affiliation = """Quantum Photonics Laboratory (Qlab)
Department of Physics "Alessandro Volta"
University of Pavia
Pavia, Italy"""
  title = "Classical training of frequency-bin quantum extreme learning machines"
  abstract = """Quantum extreme learning machines (QELMs) are promising computing architectures for classical and quantum machine-learning tasks, including the estimation of quantum state properties. Photonic implementations based on frequency-bin encoding are particularly appealing due to their high dimensionality, parallel information processing within a single spatial mode, and compatibility with standard telecom components.

In this talk, I will present our latest results on frequency-bin QELMs based on electro-optic modulation, focusing on efficient training strategies and the relationship between reservoir connectivity and inference capabilities. First, I will introduce a paradigm shift that enables QELMs to be trained exclusively with intense classical fields while performing inference on previously unseen quantum states. This approach dramatically reduces acquisition times, improves signal-to-noise ratios, and mitigates finite-sampling noise arising from the probabilistic nature of quantum measurements.

I will then demonstrate how this strategy enables efficient training of reservoirs to predict expectation values of arbitrary operators acting on single-qubit and qutrit states. In this context, I will investigate how reservoir connectivity governs inference capabilities, showing how multi-harmonic electro-optic phase modulation and dispersive optical elements respectively enhance QELM expressivity and improve the numerical stability of the training procedure."""

  [[days.events]]
  time = "17:25"
  speaker = "Dr. Stefano Signorini"
  affiliation = """Optoelectronics Group
ICFO - The Institute of Photonic Sciences
Castelldefels (Barcelona), Spain"""
  title = "Integrated photonics at ICFO: the PIXEurope Pilot line and Undetected Photon sensing."
  abstract = """In this talk, I will introduce PIXEurope, a major initiative led by ICFO and involving 20 partners across Europe. The initiative aims to establish a one-stop shop for the development of PIC-based prototypes, covering the entire value chain, from design to testing of fully packaged devices.

I will then present one of our latest silicon photonics experiments, carried out in collaboration with NanoLab, focusing on phase sensing with undetected photons. In this experiment, we demonstrated phase sensing at 2 µm while detecting only photons in the O-band, using an SU(1,1) nonlinear interferometer based on intermodal spontaneous four-wave mixing (SFWM) waveguides."""

