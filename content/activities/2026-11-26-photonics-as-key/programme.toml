  affiliation = """Neurophotonics Group
Department of Physics and Astronomy "Galileo Galilei"
Padova Neuroscience Center
University of Padova
Padova, Italy"""
  title = "The optical toolkit for brain investigation: from optogenetics to label-free imaging"
  abstract = """The brain's vast functional and compositional complexity demands a versatile toolkit to study its inner workings. Light offers a uniquely versatile medium for interacting with neural tissue, enabling researchers to probe, manipulate, and track brain function with or without fluorescent labeling in both in vitro and in vivo experiments. This talk provides an overview of modern optical techniques for monitoring and modulating neural activity across basic research, clinical diagnostics, and translational technologies."""

  [[days.events]]
  time = "16:20"
  speaker = "Dr. Ilya Auslender"
  affiliation = """Nanoscience Laboratory
Department of Physics
University of Trento
Povo, Trento, Italy"""
  title = "From optics to biology: My journey in the Nanolab 2020-2026"
  abstract = """In this talk, I will share my journey in the Nanoscience Laboratory, led by Prof. Pavesi, where I began my first postdoctoral position. I will reflect on the challenges I faced, including the transition to a new scientific field, the COVID-19 lockdown shortly after my arrival, and the experimental difficulties of working with biological cultures. Alongside these challenges, I will discuss my achievements, share my perspectives on the laboratory’s research environment and everyday life, and offer some thoughts on future directions."""

